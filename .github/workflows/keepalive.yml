name: Maintenir Supabase actif

on:
  schedule:
    # Daily trigger, database operation only every other day across month boundaries.
    - cron: '17 7 * * *'
      timezone: Africa/Douala
  workflow_dispatch:
    inputs:
      force:
        description: Effectuer une requête maintenant sans attendre le prochain jour prévu
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/keepalive.mjs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          KEEPALIVE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
